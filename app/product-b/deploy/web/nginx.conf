# nginx for product-b-web: the operator workbench (/) and the driver app (/driver/).
# Same baseline as product-a-web (app/product-a/src/web/nginx.conf): non-root on 8080, every
# write under /tmp for a read-only root, JSON access log on the shared field contract, security
# headers re-asserted per location, env.js and index.html never cached, hashed assets for a year.
#
# PATH PREFIX AT RUNTIME, NOT AT BUILD TIME. The gateway serves this app under a prefix (/tms on
# dev) and rewrites it away (URLRewrite ReplacePrefixMatch "/"), so nginx always sees "/". The
# browser still has to request assets UNDER the prefix, so sub_filter rewrites each index.html's
# <base href> to $base_href, which comes from /etc/nginx/runtime/base-href.conf. The image ships
# "/" there; the chart mounts its own. One image runs under any prefix, and a promotion to an
# environment with a different prefix never rebuilds it.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  map "$status:$http_user_agent" $loggable {
    ~^[23][0-9][0-9]:kube-probe/  0;
    default                       1;
  }
  map $status $log_level {
    ~^5      error;
    ~^4      warning;
    default  information;
  }
  # The path without the query string: the identity provider's ?code=&state= must not be logged.
  map $request_uri $path_only {
    "~^(?<p>[^?]*)"  $p;
  }
  # Seconds with millisecond resolution -> integer milliseconds (see product-a-web for the detail).
  map $request_time $duration_ms {
    ~^0\.0*(?<ms>[1-9][0-9]*)$                 $ms;
    "~^(?<s>[1-9][0-9]*)\.(?<frac>[0-9]{3})$"  $s$frac;
    default                                    0;
  }

  log_format json_contract escape=json
    '{"timestamp":"$time_iso8601","level":"$log_level",'
    '"message":"HTTP $request_method $path_only responded $status in $duration_ms ms",'
    '"logger":"nginx.access","service":"product-b-web","host":"$hostname",'
    '"http_method":"$request_method","http_path":"$path_only","http_status":$status,'
    '"duration_ms":$duration_ms,"response_bytes":$body_bytes_sent,"user_agent":"$http_user_agent"}';

  access_log /dev/stdout json_contract if=$loggable;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Sets $base_href, e.g. "/tms/".
    include /etc/nginx/runtime/base-href.conf;

    # add_header does not inherit into a location that defines its own, so each location re-asserts.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # env.js comes from the ConfigMap and is never cached. The driver app asks for it relative to
    # its own base (/driver/env.js) and gets the same file.
    location = /env.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /driver/env.js {
      alias /usr/share/nginx/html/env.js;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|webmanifest)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The driver app, built with base href /driver/. noindex and no-referrer: its URL carries a
    # bearer credential in the fragment, which must not leak to search engines or other sites.
    location /driver/ {
      try_files $uri $uri/ /driver/index.html;
      sub_filter '<base href="/driver/"' '<base href="${base_href}driver/"';
      sub_filter_once on;
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    # The workbench. index.html is never cached: it is the one file that names every hashed chunk.
    location / {
      try_files $uri $uri/ /index.html;
      sub_filter '<base href="/"' '<base href="${base_href}"';
      sub_filter_once on;
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
