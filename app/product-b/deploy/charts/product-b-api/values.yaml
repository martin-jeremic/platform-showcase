# product-b-api: structural defaults. product-b is push-based to one dev namespace (no gitops
# folder yet), so the dev values live next to the chart in values-dev.yaml.

fullnameOverride: ""
replicaCount: 2

image:
  repository: productacr.azurecr.io/product-b-api
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# One plain-JSON environment variable per configuration group, bound to IOptions in the app.
# There is no appsettings.json in the image; in Development the app reads Config/*.config.json.
# Explicit keys in templates/configmap.yaml, no `range`.
config:
  serilog: '{"MinimumLevel":{"Default":"Information"}}'
  tenancy: ""     # required: {"Mode":"SchemaPerTenant"}

# Key Vault-synced Secret holding DATABASE and IDENTITY (CSI wiring as in product-a-api).
secretName: product-b-api-secrets

podDisruptionBudget:
  enabled: true
  minAvailable: 1
