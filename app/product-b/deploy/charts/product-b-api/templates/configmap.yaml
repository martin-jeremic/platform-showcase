apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pb.fullname" . }}-config
  labels:
    {{- include "pb.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/ignore: "true"
data:
  SERILOG: {{ required "config.serilog is required" .Values.config.serilog | quote }}
  TENANCY: {{ required "config.tenancy is required" .Values.config.tenancy | quote }}
