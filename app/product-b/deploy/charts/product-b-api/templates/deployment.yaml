{{- $fullname := include "pb.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
  annotations:
    secret.reloader.stakater.com/reload: {{ .Values.secretName | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "pb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "pb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "pb.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: Database
            - name: IDENTITY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: Identity
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          {{- /* Readiness is a REAL database check (a query on the platform schema), not "the
               process answers". Verified on the image: with PostgreSQL stopped, /health/ready
               answers 503 and the pod leaves the Service; /health/live stays 200, so the kubelet
               does not restart a pod whose only problem is somebody else's outage. */}}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pb.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "pb.selectorLabels" . | nindent 4 }}
