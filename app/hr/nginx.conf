# nginx for the HR SPAs: non-root on 8080, read-only root filesystem.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  map $request_uri $path_only {
    "~^(?<p>[^?]*)"  $p;
  }
  map "$status:$http_user_agent" $loggable {
    ~^[23][0-9][0-9]:kube-probe/  0;
    default                       1;
  }
  log_format json_contract escape=json
    '{"timestamp":"$time_iso8601","logger":"nginx.access","service":"hr-app",'
    '"http_method":"$request_method","http_path":"$path_only","http_status":$status,'
    '"request_time":"$request_time","response_bytes":$body_bytes_sent}';
  access_log /dev/stdout json_contract if=$loggable;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A real health endpoint. Without it, /health falls through to the SPA fallback and returns
    # index.html with a 200: a probe that can never fail reports nothing.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Runtime config written by entrypoint.sh into the emptyDir. Never cached.
    location = /assets/config.json {
      alias /tmp/runtime-config/config.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      access_log off;
    }

    # SPA fallback; index.html never cached so a deploy is picked up on the next navigation.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
