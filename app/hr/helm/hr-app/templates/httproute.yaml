{{- /*
group/kind on parentRefs and group/kind/weight on backendRefs are the Gateway API defaults, rendered
explicitly: the API server adds them to the stored object, and without them Argo CD's diff reports
the route OutOfSync forever (the sync succeeds, the diff never clears).
*/ -}}
{{- if and .Values.gateway.enabled .Values.route.enabled }}
{{- $path := required "route.path is required (this app's prefix, e.g. /hr-portal)" .Values.route.path }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hr-app.fullname" . }}
  labels:
    {{- include "hr-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      {{- if .Values.route.rewrite.enabled }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.route.rewrite.replacePrefixMatch | quote }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "hr-app.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
