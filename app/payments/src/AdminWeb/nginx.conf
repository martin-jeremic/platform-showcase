# nginx for payments-admin-web. The SPA is served under /pay-admin and its API calls
# (/pay-admin/api/...) are reverse-proxied to the in-cluster payments-api Service.
#
# Why proxy instead of calling the API's public host from the browser: the browser sees ONE origin.
# No CORS configuration to keep in sync between two charts, no preflight requests, and the staff
# bearer token never has to be accepted cross-origin. The API's public route stays reserved for
# payment-provider callbacks.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Path without the query string; probes dropped while they succeed.
  map $request_uri $path_only {
    "~^(?<p>[^?]*)"  $p;
  }
  map "$status:$http_user_agent" $loggable {
    ~^[23][0-9][0-9]:kube-probe/  0;
    default                       1;
  }
  log_format json_contract escape=json
    '{"timestamp":"$time_iso8601","logger":"nginx.access","service":"payments-admin-web",'
    '"http_method":"$request_method","http_path":"$path_only","http_status":$status,'
    '"request_time":"$request_time","upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json_contract if=$loggable;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Probe endpoint: a real 200 that does not depend on the SPA bundle or the API.
    location = /pay-admin/health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Same namespace, so the short Service name resolves. nginx resolves it once, at start: the
    # Service must exist when this pod starts (both apps sync from the same gitops folder). The API
    # Service port is 80; the trailing /api/ replaces the matched /pay-admin/api/ prefix.
    location /pay-admin/api/ {
      proxy_pass http://payments-api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /pay-admin;
      proxy_read_timeout 300s;
    }

    location /pay-admin/assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback; index.html is never cached (it names every hashed asset).
    location /pay-admin/ {
      try_files $uri $uri/ /pay-admin/index.html;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = / {
      return 302 /pay-admin/;
    }
  }
}
