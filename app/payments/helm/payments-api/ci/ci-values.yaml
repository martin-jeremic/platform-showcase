# Lint/template values with Key Vault on (workload identity). The digest is sha256("ci"), not a
# real image.
image:
  tag: "0.1.0"
  digest: sha256:1b158839f8aa339e89bb50b1603e90ec68e0fd5565fe10a7cb32729fddf7070a
workloadIdentity:
  enabled: true
  clientId: 44444444-4444-4444-4444-444444444444
azureKeyVault:
  keyvaultName: kv-org-dev
  tenantId: 11111111-1111-1111-1111-111111111111
env:
  ASPNETCORE_ENVIRONMENT: Production
  PUBLIC_BASE_URL: https://services.example.com/payments-api
  Identity__Authority: https://services.example.com/keycloak/realms/org
  App__MigrateOnStartup: "false"
  WebhookDispatcher__Enabled: "false"
  Secrets__ActiveKeyId: k1
route:
  hostnames:
    - services.example.com
  path: /payments-api
  rewrite:
    enabled: true
sharedDocuments:
  enabled: true
  existingClaim: payments-documents
otel:
  enabled: true
  endpoint: http://alloy.monitoring.svc.cluster.local:4317
