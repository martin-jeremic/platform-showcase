{{- /*
Key Vault -> CSI driver -> synced Secret -> envFrom secretRef.

ONE PLAIN VALUE PER VAULT OBJECT, written out object by object. Key Vault secret names allow only
letters, digits and dashes, while .NET configuration keys nest with "__". So the vault object
`payments-api--broker-password` becomes the env var `RabbitMq__Password`: the Secret KEY is the
.NET key, and envFrom turns it into the variable. No naming convention to derive, no
transformation to get wrong, and `kubectl get secret -o yaml` shows exactly which variables the pod
gets. (Before: one Base64 JSON blob per service in the vault, opaque to every review.)

Every object below must exist in the vault: one missing object fails the WHOLE mount, and the pod
sits in ContainerCreating while Argo shows Synced. Seed the vault first, promote second.

authMode (how the driver authenticates to the vault):
  workloadIdentity   the pod's service account, federated with a per-app identity. The target.
  vmManagedIdentity  the node pool's identity (aks-org-prod today). kubeletClientId is its CLIENT
                     id, not the object id from the role assignment; swapping them fails the mount.
  servicePrincipal   a client-secret Secret in the namespace (the on-prem hub, which has no node
                     identity). A long-lived credential: listed in KNOWN-GAPS.
*/ -}}
{{- if .Values.azureKeyVault.enabled }}
{{- $mode := .Values.azureKeyVault.authMode }}
{{- if not (has $mode (list "workloadIdentity" "vmManagedIdentity" "servicePrincipal")) }}
{{- fail (printf "azureKeyVault.authMode must be workloadIdentity, vmManagedIdentity or servicePrincipal, got %q" $mode) }}
{{- end }}
{{- if and (eq $mode "workloadIdentity") (not .Values.workloadIdentity.enabled) }}
{{- fail "azureKeyVault.authMode=workloadIdentity requires workloadIdentity.enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.azureKeyVault.secretProviderClassName }}
  labels:
    {{- include "payments-backend.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.azureKeyVault.syncedSecretName }}
      type: Opaque
      data:
        - objectName: payments-api--database
          key: Database__Password
        - objectName: payments-api--identity-client-secret
          key: Identity__ClientSecret
        - objectName: payments-api--broker-password
          key: RabbitMq__Password
        - objectName: payments-api--provider-api-key
          key: Provider__ApiKey
        # The key that encrypts stored provider and webhook secrets. The service REFUSES TO START
        # without it outside Development, which is right: the alternative is a fixed fallback key
        # that protects nothing. It must hold the SAME value as payments-email's k1 object, or the
        # admin portal saves mail-account secrets the email service can never decrypt. Seed both
        # objects from one generated value.
        - objectName: payments-api--secrets-key-k1
          key: Secrets__Keys__k1
  parameters:
    usePodIdentity: "false"
    {{- if eq $mode "workloadIdentity" }}
    useVMManagedIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    {{- else if eq $mode "vmManagedIdentity" }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "azureKeyVault.kubeletClientId is required for vmManagedIdentity" .Values.azureKeyVault.kubeletClientId | quote }}
    {{- else }}
    useVMManagedIdentity: "false"
    {{- end }}
    tenantId: {{ required "azureKeyVault.tenantId is required" .Values.azureKeyVault.tenantId | quote }}
    keyvaultName: {{ required "azureKeyVault.keyvaultName is required" .Values.azureKeyVault.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: payments-api--database
          objectType: secret
        - |
          objectName: payments-api--identity-client-secret
          objectType: secret
        - |
          objectName: payments-api--broker-password
          objectType: secret
        - |
          objectName: payments-api--provider-api-key
          objectType: secret
        - |
          objectName: payments-api--secrets-key-k1
          objectType: secret
{{- end }}
