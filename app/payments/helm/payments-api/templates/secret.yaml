{{- /*
Fallback for renders without the CSI driver (a local `helm template`, a kind cluster): an EMPTY
Opaque Secret with exactly the keys the driver would sync, so envFrom secretRef resolves and the
service starts and reports its own missing configuration. It never carries a value: real values
only ever come from Key Vault. Not rendered when azureKeyVault.enabled.
*/ -}}
{{- if not .Values.azureKeyVault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fallbackSecret.name }}
  labels:
    {{- include "payments-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  Database__Password: ""
  Identity__ClientSecret: ""
  RabbitMq__Password: ""
  Provider__ApiKey: ""
  Secrets__Keys__k1: ""
{{- end }}
