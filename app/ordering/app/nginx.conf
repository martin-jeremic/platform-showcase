# nginx for ordering-app: non-root on 8080, read-only root filesystem.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  access_log    /dev/stdout;
  error_log     /dev/stderr warn;

  server {
    # FIX: the source listed real host names in server_name. A container behind a gateway does not
    # need to know its public names; the default server answers whatever the route sends.
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # A real health endpoint for the kubelet. Without it /health fell through try_files to the SPA
    # shell and answered index.html with a 200: a check that can never fail reports nothing.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location = /assets/config.json {
      alias /tmp/runtime-config/config.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    # Missing hashed assets are a 404, not the SPA shell (which the browser would try to run as JS).
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, must-revalidate" always;
    }
  }
}
