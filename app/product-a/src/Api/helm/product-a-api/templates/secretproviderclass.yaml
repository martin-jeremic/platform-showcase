{{- /*
Key Vault -> CSI driver -> synced Secret. Authenticates with workload identity: the driver
exchanges this pod's service-account token for the federated user-assigned identity (clientID).
The real charts used a service-principal secret (nodePublishSecretRef) on the on-prem spokes and
the kubelet identity on AKS. The first is a long-lived credential in every namespace; the second
is shared by every pod on the node and could read the WHOLE vault. One identity per app and
environment, scoped to that vault, replaces both.

The mount is all-or-nothing: one requested object missing from the vault fails the whole volume
and leaves the pod in ContainerCreating. So an optional object is requested only behind the same
flag that wires its env var (here config.blobStorage.enabled): a CONFIG flag can make a SECRET
mandatory, and the chart keeps the two in one place.

Objects are written out one by one (no `range`), object name -> Secret key.
*/ -}}
{{- if .Values.azureKeyVault.enabled }}
{{- if not .Values.workloadIdentity.enabled }}
{{- fail "azureKeyVault.enabled requires workloadIdentity.enabled: there is no other credential for the CSI driver" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.azureKeyVault.secretProviderClassName }}
  labels:
    {{- include "product-a-api.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.azureKeyVault.syncedSecretName }}
      type: Opaque
      data:
        - objectName: product-a-api--database
          key: Database
        - objectName: product-a-api--identity-client-secret
          key: IdentityClientSecret
        - objectName: product-a-api--broker-password
          key: BrokerPassword
        {{- if .Values.config.blobStorage.enabled }}
        - objectName: product-a-api--blob-connection
          key: BlobConnection
        {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    tenantId: {{ required "azureKeyVault.tenantId is required when azureKeyVault.enabled" .Values.azureKeyVault.tenantId | quote }}
    keyvaultName: {{ required "azureKeyVault.keyvaultName is required when azureKeyVault.enabled" .Values.azureKeyVault.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: product-a-api--database
          objectType: secret
        - |
          objectName: product-a-api--identity-client-secret
          objectType: secret
        - |
          objectName: product-a-api--broker-password
          objectType: secret
        {{- if .Values.config.blobStorage.enabled }}
        - |
          objectName: product-a-api--blob-connection
          objectType: secret
        {{- end }}
{{- end }}
