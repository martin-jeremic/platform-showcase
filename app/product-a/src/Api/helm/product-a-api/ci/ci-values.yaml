# Values for `helm lint` / `helm template` in CI and locally: the shape of
# gitops/apps/apps/product-a-api/<env>/values.yaml + image.yaml, with every optional branch on.
# The digest is sha256("ci"), not an image that exists.
image:
  digest: sha256:1b158839f8aa339e89bb50b1603e90ec68e0fd5565fe10a7cb32729fddf7070a
workloadIdentity:
  enabled: true
  clientId: 22222222-2222-2222-2222-222222222222
azureKeyVault:
  enabled: true
  keyvaultName: kv-product-a-stage
  tenantId: 11111111-1111-1111-1111-111111111111
imagePullSecrets:
  - name: productacr-pull
otel:
  enabled: true
  endpoint: http://alloy.monitoring.svc.cluster.local:4317
config:
  environment: Stage
  identity:
    authority: https://dev.example.com/keycloak/realms/product-a-stage
    audience: product-a-api
    clientId: product-a-api
  broker:
    host: rabbitmq.rabbitmq.svc.cluster.local
    virtualHost: /product-a
    username: product-a-stage
  moduleBaseUrl: http://product-a-module
  blobStorage:
    enabled: true
    accountUrl: http://azurite.storage.svc.cluster.local:10000/devstoreaccount1
    container: documents
gateway:
  enabled: true
route:
  enabled: true
  hostnames:
    - stage.product-a.example.net
  hubs:
    enabled: true
autoscaling:
  enabled: true
verticalPodAutoscaler:
  enabled: true
