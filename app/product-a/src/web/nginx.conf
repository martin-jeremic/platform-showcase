# nginx for the product-a-web SPA: non-root on 8080, read-only root filesystem, JSON access log.

worker_processes auto;
# Every path nginx writes lives under /tmp, the only writable folder under the chart's
# readOnlyRootFilesystem (an emptyDir). Same settings as the upstream unprivileged nginx image;
# the compiled-in defaults (/run/nginx.pid, /var/cache/nginx/*_temp) sit on the read-only root.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # nginx creates all five temp folders at start, used or not, so every one is declared.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # --- Access log on the platform's log-field contract ------------------------------------------
  # One JSON object per line with the same field names as the .NET and Python services, so one log
  # query covers all of them. The default `combined` text format matched none of them.

  # Successful kubelet probes are dropped, as the .NET and Python request loggers do: the probe on
  # /env.js was about two thirds of everything this pod logged. A failing probe is still logged.
  map "$status:$http_user_agent" $loggable {
    ~^[23][0-9][0-9]:kube-probe/  0;
    default                       1;
  }

  map $status $log_level {
    ~^5      error;
    ~^4      warning;
    default  information;
  }

  # $request_time is seconds with millisecond resolution ("0.003", "1.234"). The contract field is
  # duration_ms, a JSON NUMBER, and nginx cannot do arithmetic, so the regex drops the dot and the
  # leading zeros: "0.003" -> 3, "1.234" -> 1234, "0.000" -> 0 (default).
  map $request_time $duration_ms {
    ~^0\.0*(?<ms>[1-9][0-9]*)$                 $ms;
    "~^(?<s>[1-9][0-9]*)\.(?<frac>[0-9]{3})$"  $s$frac;
    default                                    0;
  }

  # The path as the client asked for it, WITHOUT the query string. $uri would log /index.html for
  # every SPA route (try_files rewrites it); $request_uri carries the query, including the identity
  # provider's ?code=...&state=... on the login redirect, which must never reach a log store.
  map $request_uri $path_only {
    "~^(?<p>[^?]*)"  $p;
  }

  log_format json_contract escape=json
    '{"timestamp":"$time_iso8601","level":"$log_level",'
    '"message":"HTTP $request_method $path_only responded $status in $duration_ms ms",'
    '"logger":"nginx.access","service":"product-a-web","host":"$hostname",'
    '"http_method":"$request_method","http_path":"$path_only","http_status":$status,'
    '"duration_ms":$duration_ms,"response_bytes":$body_bytes_sent,'
    '"user_agent":"$http_user_agent"}';

  access_log /dev/stdout json_contract if=$loggable;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Clickjacking protection must come from response headers: frame-ancestors in a <meta> CSP is
    # ignored by browsers. X-Frame-Options stays for browsers without CSP2.
    #
    # add_header is NOT inherited into a location that defines any add_header of its own. Every
    # location below sets Cache-Control, so every location re-asserts the full set. A new security
    # header goes into ALL FOUR places, or some responses silently ship without it.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Probe endpoint answered by nginx itself: independent of the bundle, env.js and the API.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # env.js is the per-environment config, replaced by the ConfigMap. Never cached.
    location = /env.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed assets: a new build has new names, so they can be cached for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback. index.html is never cached: it is the only file with a stable name and the one
    # that names every hashed chunk. A browser holding yesterday's copy asks for chunks that no longer
    # exist, gets 404s, and lazy-loaded screens simply do nothing - a tab left open across a deploy
    # was enough to produce "nothing in Settings works". no-store rather than no-cache, because a
    # revalidation that cannot reach the server (an offline laptop) would still serve the stale copy.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }
}
