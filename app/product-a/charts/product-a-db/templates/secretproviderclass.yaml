{{- /*
OWN names for every object this chart creates (product-a-db-kv / product-a-db-secrets), never the
API chart's. Two Argo Applications owning an object of the same name in one namespace is a
shared-resource conflict, and `prune` on either one deletes the other's object.

The single Key Vault object is the SAME one product-a-api reads (one database, one connection
secret), read through a second, independently named SecretProviderClass. Not a duplicated secret.
*/ -}}
{{- if .Values.azureKeyVault.enabled }}
{{- if not .Values.workloadIdentity.enabled }}
{{- fail "azureKeyVault.enabled requires workloadIdentity.enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.azureKeyVault.secretProviderClassName }}
  labels:
    {{- include "product-a-db.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.azureKeyVault.syncedSecretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.azureKeyVault.databaseObjectName }}
          key: Database
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    tenantId: {{ required "azureKeyVault.tenantId is required" .Values.azureKeyVault.tenantId | quote }}
    keyvaultName: {{ required "azureKeyVault.keyvaultName is required" .Values.azureKeyVault.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.azureKeyVault.databaseObjectName }}
          objectType: secret
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "product-a-db.fullname" . }}
  labels:
    {{- include "product-a-db.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
