apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "refdata.fullname" . }}
  labels:
    {{- include "refdata.labels" . | nindent 4 }}
  {{- if .Values.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when enabled" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.azureKeyVault.enabled }}
---
{{- /* Same pattern as product-a-api's secretproviderclass.yaml (read that one for the reasoning). */}}
{{- if not .Values.workloadIdentity.enabled }}
{{- fail "azureKeyVault.enabled requires workloadIdentity.enabled" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.azureKeyVault.secretProviderClassName }}
  labels:
    {{- include "refdata.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.azureKeyVault.syncedSecretName }}
      type: Opaque
      data:
        - objectName: product-a-referencedata--database
          key: Database
        - objectName: product-a-referencedata--broker-password
          key: BrokerPassword
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    tenantId: {{ required "azureKeyVault.tenantId is required" .Values.azureKeyVault.tenantId | quote }}
    keyvaultName: {{ required "azureKeyVault.keyvaultName is required" .Values.azureKeyVault.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: product-a-referencedata--database
          objectType: secret
        - |
          objectName: product-a-referencedata--broker-password
          objectType: secret
{{- end }}
