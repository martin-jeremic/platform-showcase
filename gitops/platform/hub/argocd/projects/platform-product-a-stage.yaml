# AppProject platform-product-a-stage: the tenancy + RBAC boundary for the platform
# components on product-a-stage. appsets/platform-product-a-stage.yaml puts every Application it generates
# here.
#
# sync-wave -1: the root applies AppProjects before the ApplicationSets (wave 0);
# the appset controller skips any Application whose project does not exist yet.
#
# DENY BY DEFAULT. Argo CD's global policy.default is role:readonly for logged-in
# users, and the global policy.csv grants admin to argocd-admins only. The ONE
# extra right on this cluster is the `developer` role below, bound to a Keycloak
# group whose membership is managed in Keycloak, not here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-product-a-stage
  namespace: argocd-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: platform
spec:
  description: Platform components on product-a-stage
  sourceRepos:
    # Charts, at per-chart tags.
    - https://dev.azure.com/example-org/platform/_git/org-platform
    # This repo: the $values source of every Application.
    - https://dev.azure.com/example-org/platform/_git/org-platform-gitops
  destinations:
    # This cluster only; platform components span many namespaces.
    - name: product-a-stage
      namespace: '*'
  # Platform charts install cluster-scoped kinds (CRDs, ClusterIssuers, GatewayClass,
  # ClusterRoles, StorageClasses, admission policies). On a hub that manages a fleet
  # this stays '*'; the island, with one cluster and a known component list,
  # enumerates them instead.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    # Subject must be proj:platform-product-a-stage:developer and object platform-product-a-stage/*. One
    # malformed line disables EVERY policy of this project (argocd-server logs
    # "Failed to load casbin policies"); nothing validates it on sync.
    - name: developer
      description: Read, sync, resource actions (e.g. restart) and pod logs. No edit, delete or create.
      groups:
        - argocd-platform-product-a-stage
      policies:
        - p, proj:platform-product-a-stage:developer, applications, get, platform-product-a-stage/*, allow
        - p, proj:platform-product-a-stage:developer, applications, sync, platform-product-a-stage/*, allow
        - p, proj:platform-product-a-stage:developer, applications, action/*, platform-product-a-stage/*, allow
        - p, proj:platform-product-a-stage:developer, logs, get, platform-product-a-stage/*, allow
