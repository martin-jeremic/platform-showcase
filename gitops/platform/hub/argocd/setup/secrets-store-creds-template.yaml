# Azure Key Vault credential (service principal) for the Secrets Store CSI driver in
# ONE namespace of an on-prem cluster with no federated identity -- the
# `servicePrincipal` auth option of every Key Vault consumer. Today:
# product-a-stage, namespaces rabbitmq and observability.
#
# THE LABEL IS LOAD-BEARING. The driver runs with filteredWatchSecret: it only
# watches Secrets labelled secrets-store.csi.k8s.io/used=true. Without the label the
# first mount still works (it reads the Secret once), but every ROTATION fails
# silently afterwards -- the driver never sees the credential again.
#
# ONE-TIME, UNMANAGED -- not in ../kustomization.yaml, so Argo never reconciles or
# prunes it. This file is the SHAPE; do NOT commit real credentials. Apply with the
# values substituted in memory (PowerShell; the credential never lands in a file):
#   $ctx = '<kube context of the spoke>'
#   $id  = az keyvault secret show --vault-name kv-product-a-stage --name csi-sp-client-id --query value -o tsv
#   $sec = az keyvault secret show --vault-name kv-product-a-stage --name csi-sp-client-secret --query value -o tsv
#   (Get-Content secrets-store-creds-template.yaml -Raw).
#     Replace('REPLACE_WITH_NAMESPACE', 'observability').
#     Replace('REPLACE_WITH_SP_CLIENT_ID', $id).
#     Replace('REPLACE_WITH_SP_CLIENT_SECRET', $sec) | kubectl --context $ctx apply -f -
#
# The namespace may not exist until the Application's first sync creates it
# (CreateNamespace); create it first -- Argo tolerates an existing one. It must exist
# BEFORE the consumer's descriptor lands, or the pod sits in ContainerCreating with
# "fetching NodePublishSecretRef <ns>/secrets-store-creds failed".
#
# Check: DATA 2 and the label.
#   kubectl -n <ns> get secret secrets-store-creds --show-labels
apiVersion: v1
kind: Secret
metadata:
  name: secrets-store-creds        # = nodePublishSecretRef.name of the CSI volume
  namespace: REPLACE_WITH_NAMESPACE
  labels:
    secrets-store.csi.k8s.io/used: "true"   # REQUIRED: rotation breaks without it
type: Opaque
stringData:
  # Key names are fixed by the Azure Key Vault provider. Single-quoted so a secret
  # that starts with ~ or contains ": " stays a string.
  clientid: 'REPLACE_WITH_SP_CLIENT_ID'
  clientsecret: 'REPLACE_WITH_SP_CLIENT_SECRET'
