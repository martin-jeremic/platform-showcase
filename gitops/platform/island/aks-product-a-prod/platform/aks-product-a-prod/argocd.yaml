# Platform descriptor -- its PRESENCE deploys 'argocd' to 'aks-product-a-prod'.
chartPath:     argocd
chartRevision: argocd-1.3.0   # pinned git tag -- the pin that makes rollback possible
releaseName:   argocd
namespace:     argocd
syncWave:      "5"
# prune: false -- this component manages the controller performing the sync.
# Pruning your own controller mid-sync bricks the cluster.
prune:         false
