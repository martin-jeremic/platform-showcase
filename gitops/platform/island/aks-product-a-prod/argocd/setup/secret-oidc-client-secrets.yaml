# The two OIDC client secrets that cannot come from Key Vault over CSI: Argo CD reads
# its client secret from argocd-secret through the API server, and Grafana from an
# env var populated by secretKeyRef -- neither mounts a SecretProviderClass, and
# adding one to argocd-server or the Grafana pod would mean patching subchart
# templates to carry a volume that exists only to make CSI notice. A bounded,
# documented exception.
#
# ORDER MATTERS: Keycloak (wave 4) must exist first. The client secrets are
# GENERATED BY KEYCLOAK when the clients are created -- by the realm IaC, not by
# hand (infra/: realm `product-a`, confidential clients `argocd` and
# `grafana`). Read them from the tofu output, not from the admin console, then apply
# them BEFORE wave 5 (argocd, grafana-sso-gateway) syncs. Applying placeholders
# early yields an Argo CD that looks healthy and fails at the moment a human tries
# to log in -- the moment you need it to debug itself.
#
# The client id MUST equal clientID in the argocd values' oidc.config (`argocd`);
# a client created under another id fails the token exchange with invalid_client.
#
# ONE-TIME, UNMANAGED. Fill in memory, never on disk.
---
# argocd-secret already exists: the tofu bootstrap created it, holding the server's
# signature key and the local admin password hash. PATCH it -- do not apply a whole
# object -- so those keys cannot be lost:
#   kubectl -n argocd patch secret argocd-secret --type merge \
#     -p '{"stringData":{"oidc.keycloak.clientSecret":"<value>"}}'
#   kubectl -n argocd rollout restart deploy/argocd-server   # it caches the provider
# (This is why the argocd chart sets configs.secret.createSecret: false -- managing
# the object would rewrite it from values on every sync and regenerate the
# signature key, invalidating every session.)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  oidc.keycloak.clientSecret: REPLACE_WITH_ARGOCD_CLIENT_SECRET
---
# Grafana's OIDC client secret. Its key `client-secret` is NOT an env var name, so
# the observability chart maps it with envValueFrom -> GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
# Loading it with envFromSecrets instead injects a dead `client-secret` variable and
# NO client secret -- which fails when a user clicks "Sign in with Keycloak", not at
# deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc
  namespace: observability
type: Opaque
stringData:
  client-secret: REPLACE_WITH_GRAFANA_CLIENT_SECRET
