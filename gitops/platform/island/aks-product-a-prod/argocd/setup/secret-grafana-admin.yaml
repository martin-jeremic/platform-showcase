# Grafana's local admin (break-glass) credential. The observability chart points at
# it with admin.existingSecret; without that, the Grafana subchart renders an admin
# Secret with a random password on EVERY render -- every Argo sync rotated it, and
# CI's no-literal-password gate could not tell it from a committed one.
#
# Must exist BEFORE observability syncs, or the Grafana pod sits in
# CreateContainerConfigError. ONE-TIME, UNMANAGED; generate the password with a
# CSPRNG and keep the record in Key Vault:
#   pw=$(openssl rand -base64 24)
#   az keyvault secret set --vault-name kv-product-a-prod --name grafana-admin-password --value "$pw" -o none
#   kubectl -n observability create secret generic grafana-admin \
#     --from-literal=admin-user=admin --from-literal=admin-password="$pw"
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: REPLACE_WITH_GENERATED_PASSWORD
