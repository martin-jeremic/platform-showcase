# The DNS-01 API token cert-manager's ClusterIssuer uses (Zone:DNS:Edit on the
# product zone only -- scope it to exactly the zones this cluster issues for).
#
# Why it is here and not in Key Vault over CSI: the CSI driver only syncs a Secret
# while a pod mounts the SecretProviderClass volume, and cert-manager mounts
# nothing. The token's record of truth IS Key Vault; what it cannot do is get from
# there into the cluster by itself.
#
# The cert-manager chart has no template that could create this Secret, and no
# values key that could hold the token -- deliberately: the chart it was forked from
# had both, and a live token was committed through them. That token is
# compromised; the one seeded here must be freshly rotated.
#
# ONE-TIME, UNMANAGED -- excluded from ../kustomization.yaml. Do not fill this file;
# create the Secret straight from the vault, so the token never lands on disk:
#   kubectl -n cert-manager create secret generic cloudflare-api-token \
#     --from-literal=api-token="$(az keyvault secret show --vault-name kv-product-a-prod \
#       --name cloudflare-api-token --query value -o tsv)"
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: REPLACE_WITH_ROTATED_TOKEN
