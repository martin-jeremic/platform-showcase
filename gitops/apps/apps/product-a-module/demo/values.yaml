# Demo env config for product-a-module (Python FastAPI), cluster aks-product-a-demo.
# Non-sensitive only: secrets come from kv-product-a-demo through the Secrets Store CSI driver. Safe to commit.
# The image digest comes from demo/image.yaml (listed after this file in the Application).
#
# Every key the chart reads per environment is STATED here, never inherited from a chart default
# (scripts/check-configmaps.py enforces it). Silence is not a decision.

# ── Identity and secrets ─────────────────────────────────────────────────────────────────────
# Workload identity: the pod's service account is federated with ONE user-assigned identity per
# app and environment, which holds Key Vault Secrets User on kv-product-a-demo and nothing else.
# Replaces node (kubelet) identity, which every pod on the node shared and which could read the
# WHOLE vault.
workloadIdentity:
  enabled: true
  clientId: "33333333-bbbb-0000-0000-000000000000"   # per environment; NOT the object id of the identity

azureKeyVault:
  enabled: true
  keyvaultName: kv-product-a-demo
  tenantId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"

# Mandatory Key Vault objects: product-a-module--llm-api-key, product-a-module--m2m-client-secret,
# and product-a-module--prompt-governance-client-secret WHILE config.promptGovernance.enabled is
# true. Seed that object BEFORE enabling the flag: the CSI mount fails as a whole without it.

# No pull secret: the kubelet identity holds AcrPull on the registry. A dangling reference only
# produced FailedToRetrieveImagePullSecret warnings on every pod.
imagePullSecrets: []

image:
  pullPolicy: IfNotPresent

# ── Routing (Gateway API) ────────────────────────────────────────────────────────────────────
# sectionName pins the route to the TLS listener. Without it the route also binds the plain-HTTP
# listener and the service answers on :80. Listener hostnames match EXACTLY: a route on any other
# host cannot attach, and Argo still shows Synced/Healthy while it reports NoMatchingParent.
gateway:
  enabled: true
  name: traefik-gateway
  namespace: traefik
  sectionName: websecure

route:
  enabled: true
  hostnames:
    - demo.product-a.example.net
  path: /module
  rewrite:
    enabled: true
    replacePrefixMatch: /

# ── Scaling, health, placement (owned per env) ───────────────────────────────────────────────
# Stays at 1 until the module's in-memory rate limiter is moved to the broker; two pods would
# double the effective LLM request budget.
replicaCount: 1

# While enabled is false the Deployment uses replicaCount. Turning it on makes replicaCount inert:
# the HPA owns the replica count from then on.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 75

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# startupProbe: failureThreshold x periodSeconds is the boot budget before the kubelet kills the
# pod. readinessProbe gates Service endpoints. livenessProbe RESTARTS the container, so it stays
# off unless the service can genuinely wedge.
startupProbe:
  enabled: true
  path: /health/live
  periodSeconds: 5
  failureThreshold: 30
readinessProbe:
  enabled: true
  path: /health/ready
  periodSeconds: 10
  failureThreshold: 3
livenessProbe:
  enabled: false
  path: /health/live
  periodSeconds: 30
  failureThreshold: 3

nodeSelector: { agentpool: workload }
tolerations: []
# One replica: nothing to spread.
affinity: {}

# OpenTelemetry endpoint: standalone observability on this cluster.
otel:
  enabled: true
  endpoint: http://alloy.monitoring.svc.cluster.local:4317

# ── ConfigMap ───────────────────────────────────────────────────────────────────────────────
# Every key is set. An omitted key is not "default": an unguarded template key renders the chart
# default, a guarded one renders NO variable and the application's built-in DEV default wins.
# That is how one environment once requested machine-to-machine tokens from the dev identity
# provider: its token URL was simply missing here.
config:
  environment: "Demo"
  logLevel: "INFO"
  # The Azure OpenAI DEPLOYMENT name (not the catalogue model id) on the Foundry resource.
  llmDeployment: "llm-product-a"
  llmBaseUrl: "https://foundry-product-a.openai.azure.com/openai/v1"
  apiBaseUrl: "http://product-a-api"
  m2m:
    tokenUrl: "https://demo.product-a.example.net/keycloak/realms/product-a-demo/protocol/openid-connect/token"
    clientId: "product-a-module"
  # Fail-closed governed prompt resolution against the API. Makes a Key Vault object mandatory.
  promptGovernance:
    enabled: true
    baseUrl: "http://product-a-api"
  capacity:
    # The code default, stated explicitly; tune here deliberately, never by omission.
    llmMaxInflightPerPod: "12"
    batchEnrichmentEnabled: "1"
