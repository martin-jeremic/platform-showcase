# Service-principal credential for the Secrets Store CSI driver on the dev HUB (an on-prem
# cluster: no kubelet managed identity exists there). Charts with azureKeyVault.authMode
# servicePrincipal render a SecretProviderClass whose nodePublishSecretRef names this Secret.
#
# NAMESPACE-SCOPED, not per app: one per business namespace on the hub. On aks-org-prod the
# charts authenticate as the node identity instead (see the README's KNOWN-GAPS).
# Values must allow get/list on kv-org-dev only. ONE-TIME and UNMANAGED (not in a render target).
# This file is the documented SHAPE; never commit real values.
#
# THE LABEL IS NOT OPTIONAL. The CSI driver watches Secrets through a FILTERED informer whose
# cache only holds Secrets labelled secrets-store.csi.k8s.io/used=true. Without the label the
# initial mount still works (the kubelet passes the credential to NodePublishVolume itself, so the
# driver never looks it up), but every ROTATION fails with
#   MountRotationFailed: failed to get node publish secret <ns>/secrets-store-creds ... not found
# on a Secret that plainly exists. Key Vault values then freeze silently: nothing turns Degraded,
# Argo stays Healthy, and the breakage surfaces only at the next pod restart, long after the
# rotation that caused it. An earlier version of this recipe omitted the label, and two
# namespaces ran on frozen values for days.
#
# Imperative equivalent (per namespace):
#   kubectl -n hr create secret generic secrets-store-creds \
#     --from-literal=clientid=REPLACE_ME --from-literal=clientsecret=REPLACE_ME
#   kubectl -n hr label secret secrets-store-creds secrets-store.csi.k8s.io/used=true
apiVersion: v1
kind: Secret
metadata:
  name: secrets-store-creds
  namespace: hr                              # repeat for payments, access, i18n, ordering
  labels:
    secrets-store.csi.k8s.io/used: "true"    # REQUIRED; see above
type: Opaque
stringData:
  clientid: REPLACE_ME
  clientsecret: REPLACE_ME
