# AppProject services-payments: tenancy + RBAC boundary for namespace `payments` (payments-api, payments-invoicing, payments-email, payments-admin-web).
# The `services` ApplicationSet sets spec.project to services-<destination.namespace>, so a
# namespace without a file in this folder gets no Applications at all (fail closed).
# sync-wave -1: the root app applies the AppProjects before the ApplicationSet (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services-payments
  namespace: argocd-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: services
spec:
  description: Company services in namespace payments, dev (hub) and services (aks-org-prod)
  sourceRepos:
    - https://dev.azure.com/example-org/platform/_git/services-gitops
    - orgacr.azurecr.io/helm
  destinations:
    # dev: the hub itself, addressed in-cluster.
    - server: https://kubernetes.default.svc
      namespace: payments
    # services: the registered production spoke.
    - name: aks-org-prod
      namespace: payments
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    # Subject proj:services-payments:developer, object services-payments/*. ONE MALFORMED LINE DISABLES EVERY POLICY OF THIS
    # PROJECT ("Failed to load casbin policies" in argocd-server), and nothing validates it on
    # sync. Validate offline before merging (README, "Access model").
    - name: developer
      description: Read, sync, resource actions (e.g. restart) and pod logs. No edit, delete or create.
      groups:
        - argocd-payments   # Keycloak realm org-test; membership is managed in Keycloak, never in Git
      policies:
        - p, proj:services-payments:developer, applications, get, services-payments/*, allow
        - p, proj:services-payments:developer, applications, sync, services-payments/*, allow
        - p, proj:services-payments:developer, applications, action/*, services-payments/*, allow
        - p, proj:services-payments:developer, logs, get, services-payments/*, allow
