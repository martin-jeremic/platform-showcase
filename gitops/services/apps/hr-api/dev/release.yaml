# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys hr-api to dev.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
chart:
  name: "hr-api"
  version: "0.12.3"
# dev = the hub itself, addressed in-cluster. `name` stays present and empty: missingkey=error.
destination:
  server: "https://kubernetes.default.svc"
  name: ""
  namespace: hr
