# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys payments-admin-web to dev.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
chart:
  name: "payments-admin-web"
  version: "0.9.2"
# dev = the hub itself, addressed in-cluster. `name` stays present and empty: missingkey=error.
destination:
  server: "https://kubernetes.default.svc"
  name: ""
  namespace: payments
