# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys payments-admin-web to services.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
chart:
  name: "payments-admin-web"
  version: "0.9.0"
# services = the registered spoke. `server` stays present and empty: missingkey=error.
destination:
  server: ""
  name: "aks-org-prod"
  namespace: payments
