# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys hr-employee-book to services.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
# chart.name is hr-app, shared by all four HR frontends; the Argo Application and the
# Helm release are named after this folder.
chart:
  name: "hr-app"
  version: "1.0.4"
# services = the registered spoke. `server` stays present and empty: missingkey=error.
destination:
  server: ""
  name: "aks-org-prod"
  namespace: hr
