# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys i18n-app to dev.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
chart:
  name: "i18n-app"
  version: "1.2.2"
# dev = the hub itself, addressed in-cluster. `name` stays present and empty: missingkey=error.
destination:
  server: "https://kubernetes.default.svc"
  name: ""
  namespace: i18n
