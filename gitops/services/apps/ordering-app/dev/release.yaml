# Env descriptor read by the `services` ApplicationSet. Its PRESENCE deploys ordering-app to dev.
# chart.version is written by the CD promotion; chart.name and destination are hand-seeded once.
chart:
  name: "ordering-app"
  version: "0.8.4"
# dev = the hub itself, addressed in-cluster. `name` stays present and empty: missingkey=error.
destination:
  server: "https://kubernetes.default.svc"
  name: ""
  namespace: ordering
