{{- if .Values.gateway.enabled -}}
{{- $fullName := include "keycloak.fullname" . -}}
{{- $host := required "config.host is required -- it is both the HTTPRoute hostname and KC_HOSTNAME, and a wrong value breaks every OIDC redirect" .Values.config.host -}}
{{- $relPath := (get .Values.config.options "KC_HTTP_RELATIVE_PATH") | default "/" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      # websecure only: a route without sectionName also binds to plaintext `web`.
      sectionName: {{ required "gateway.sectionName is required" .Values.gateway.sectionName }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            # Derived from KC_HTTP_RELATIVE_PATH, the path Keycloak itself serves
            # under, so the two cannot drift.
            value: {{ $relPath | quote }}
      {{- if or .Values.route.middlewares .Values.route.rewrite.enabled }}
      filters:
        {{- range .Values.route.middlewares }}
        # Traefik Middleware in THIS namespace (ExtensionRef is namespace-local);
        # the traefik chart renders auth-ratelimit into it.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ . }}
        {{- end }}
        {{- if .Values.route.rewrite.enabled }}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .Values.route.rewrite.replacePrefixMatch | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
