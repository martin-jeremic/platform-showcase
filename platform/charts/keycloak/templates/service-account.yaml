{{- $kv := .Values.azureKeyVault | default dict -}}
{{- $workloadIdentity := and ($kv.enabled | default false) (eq ($kv.authMode | default "workloadIdentity") "workloadIdentity") -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keycloak.serviceAccountName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- if or $workloadIdentity .Values.serviceAccount.annotations }}
  annotations:
    {{- if $workloadIdentity }}
    # Azure Workload Identity federation. The managed identity must also carry a
    # federated credential whose subject is
    #   system:serviceaccount:{{ .Release.Namespace }}:{{ include "keycloak.serviceAccountName" . }}
    # and hold `Key Vault Secrets User` on azureKeyVault.keyvaultName.
    azure.workload.identity/client-id: {{ $kv.workloadIdentityClientId | required "azureKeyVault.workloadIdentityClientId is required when authMode=workloadIdentity" | quote }}
    azure.workload.identity/tenant-id: {{ $kv.tenantId | required "azureKeyVault.tenantId is required" | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end -}}
