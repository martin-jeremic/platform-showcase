{{- $kv := .Values.azureKeyVault | default dict -}}
{{- if ($kv.enabled | default false) }}
{{- $prefix := $kv.secretPrefix | default "" -}}
{{- $secrets := $kv.secrets | default list -}}
{{- if not $secrets }}
  {{- fail "azureKeyVault.enabled=true but azureKeyVault.secrets is empty — the synced Secret would have no keys and the pod would fail to start" }}
{{- end }}
{{- $authMode := $kv.authMode | default "workloadIdentity" -}}
{{- if not (has $authMode (list "servicePrincipal" "workloadIdentity" "vmManagedIdentity")) }}
  {{- fail (printf "azureKeyVault.authMode must be one of 'servicePrincipal', 'workloadIdentity', 'vmManagedIdentity', got %q" $authMode) }}
{{- end }}
#
# Single source of truth for EVERY Keycloak secret.
#
# azureKeyVault.secrets (values) drives all three places a secret must appear:
#   1. parameters.objects  — what the CSI driver fetches from Key Vault
#   2. secretObjects       — the ONE Kubernetes Secret they are synced into
#   3. deployment.yaml env — container env vars, by secretKeyRef
# Adding a secret is a one-line values change; no template edit.
#
# ── Rotation ──────────────────────────────────────────────────────────────────
# Rotation is NOT configurable here. The SecretProviderClass CRD accepts exactly
# three spec fields — provider, parameters, secretObjects — so the previous
# `spec.rotationPollInterval` in this template was an UNDECLARED field. ArgoCD's
# structured-merge diff rejects those with
#     ComparisonError: ... field not declared in schema
# the same class of failure seen on the chart this was forked from. It only stayed
# dormant because every env file left rotationPollInterval empty, so the `if`
# never fired. Setting it would have broken the Application.
#
# Rotation belongs to the CSI DRIVER, configured by the secrets-store-csi chart:
#     --enable-secret-rotation=true   --rotation-poll-interval=5m
# The driver re-reads Key Vault on that interval and updates both the mounted
# file and this synced Secret. Env vars sourced via secretKeyRef do NOT pick that
# up in a running container, so the Deployment carries a Reloader annotation that
# restarts the pod when this Secret changes. Rotation without Reloader is a no-op.
#
# ── Why the pod must mount the volume ─────────────────────────────────────────
# secretObjects are only materialised while a pod mounts this SecretProviderClass.
# The Secret does not exist before the first successful mount, and the driver
# fails the WHOLE mount if any single objectName is absent from Key Vault — so
# every entry below must be seeded in the vault BEFORE deploying.
#
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $kv.secretProviderClassName | required "azureKeyVault.secretProviderClassName is required" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  provider: azure

  # The one Kubernetes Secret every Keycloak credential lands in.
  secretObjects:
    - secretName: {{ $kv.syncedSecretName | required "azureKeyVault.syncedSecretName is required" }}
      type: Opaque
      data:
        {{- range $secrets }}
        {{- if not .kvName }}{{ fail "every azureKeyVault.secrets entry needs kvName" }}{{ end }}
        {{- if not .key }}{{ fail (printf "azureKeyVault.secrets entry %q needs key" .kvName) }}{{ end }}
        # -> {{ .env | default "(mounted file only, no env var)" }}
        - objectName: {{ printf "%s--%s" $prefix .kvName | quote }}
          key: {{ .key | quote }}
        {{- end }}

  parameters:
    # usePodIdentity is the retired aad-pod-identity path — never used in any mode.
    # Workload identity is selected by clientID plus ServiceAccount federation, not
    # by either of these flags, so both stay false there too.
    usePodIdentity: "false"
    useVMManagedIdentity: {{ if eq $authMode "vmManagedIdentity" }}"true"{{ else }}"false"{{ end }}
    {{- if eq $authMode "vmManagedIdentity" }}
    # Kubelet (node) managed identity. The driver authenticates as the node's own
    # identity, which must hold `Key Vault Secrets User` on this vault — granted in
    # the IaC identity/role assignments.
    #
    # This is the identity's CLIENT id, not the object/principal id that appears in
    # the role assignment. They are different GUIDs and swapping them fails the mount
    # with an authentication error that names neither.
    #
    # Coarser than workloadIdentity: access is granted to the NODE, so any pod
    # scheduled there can mount this vault. Accepted here because it needs no OIDC
    # issuer, no federated credential, and no per-service identity — the same
    # trade-off the application demo overlays once made. NOT the default.
    userAssignedIdentityID: {{ $kv.kubeletClientId | required "azureKeyVault.kubeletClientId is required when authMode=vmManagedIdentity — the kubelet MI client_id, from `tofu output kubelet_client_id`" | quote }}
    {{- end }}
    {{- if eq $authMode "workloadIdentity" }}
    # Client ID of the user-assigned managed identity federated to this chart's
    # ServiceAccount. Also requires: serviceAccount.create=true, the SA annotated
    # with azure.workload.identity/client-id, the pod labelled
    # azure.workload.identity/use="true" (both handled by this chart), a federated
    # credential for system:serviceaccount:<ns>:<sa>, and the identity holding
    # `Key Vault Secrets User` on the vault.
    clientID: {{ $kv.workloadIdentityClientId | required "azureKeyVault.workloadIdentityClientId is required when authMode=workloadIdentity" | quote }}
    {{- end }}
    tenantId: {{ $kv.tenantId | required "azureKeyVault.tenantId is required" | quote }}
    # `required` on purpose. An EMPTY keyvaultName renders a valid-LOOKING
    # SecretProviderClass whose mount then hangs forever in ContainerCreating
    # with no useful event. That is the live dev failure: SPC
    # keycloak-secret-provider carried an empty keyvaultName for weeks.
    keyvaultName: {{ $kv.keyvaultName | required "azureKeyVault.keyvaultName is required" | quote }}

    objects: |
      array:
        {{- range $secrets }}
        - |
          objectName: {{ printf "%s--%s" $prefix .kvName }}
          objectType: secret
        {{- end }}
{{- end }}
