{{- include "oidc-issuer.assertNamespace" . }}
{{- /*
The apiserver only speaks HTTPS, so Traefik must connect with TLS and verify it.
Both inputs are the cluster's own, not copies: kube-root-ca.crt is published
into every namespace by kube-controller-manager, and kubernetes.default.svc is
one of the apiserver certificate's SANs.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "oidc-issuer.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oidc-issuer.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kubernetes
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
    hostname: kubernetes.default.svc
