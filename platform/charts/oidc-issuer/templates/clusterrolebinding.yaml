{{- /*
Lets anonymous callers -- Entra, from the internet -- read the issuer. The
built-in ClusterRole grants GET on exactly four non-resource URLs:
/.well-known/openid-configuration(/) and /openid/v1/jwks(/). Nothing else.
The built-in binding of the same name covers only system:serviceaccounts,
which is why the route alone answers 403.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oidc-issuer.fullname" . }}-anonymous
  labels:
    {{- include "oidc-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
