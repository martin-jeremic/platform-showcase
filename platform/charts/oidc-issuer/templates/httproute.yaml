{{- include "oidc-issuer.assertNamespace" . }}
{{- /*
Exposes ONLY the apiserver's two OIDC discovery paths. Each is an Exact match
rewritten to the path the apiserver serves, so nothing else under pathPrefix --
and nothing else of the apiserver -- is reachable through the Gateway.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "oidc-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oidc-issuer.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "gateway.name is required" .Values.gateway.name }}
      namespace: {{ required "gateway.namespace is required" .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "route.hostname is required" .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ printf "%s/.well-known/openid-configuration" .Values.route.pathPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /.well-known/openid-configuration
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes
          port: 443
    - matches:
        - path:
            type: Exact
            value: {{ printf "%s/openid/v1/jwks" .Values.route.pathPrefix | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /openid/v1/jwks
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes
          port: 443
