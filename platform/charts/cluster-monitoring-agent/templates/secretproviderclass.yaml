{{- /*
mtls.source=keyVault: Azure Key Vault -> files inside the Alloy pod, via the
Secrets Store CSI driver. The cluster values' CSI volume
(alloy.controller.volumes.extra, volumeAttributes.secretProviderClass = this name)
mounts the three objects at /etc/alloy/tls under the aliases the Alloy config
reads. Consequences:
  - no Kubernetes Secret is synced (no secretObjects), and none is hand-seeded;
  - rotation is a vault write: the driver rewrites the mounted files every
    rotationPollInterval; Alloy re-reads the client cert on reconnect.

The only source an Argo-rendered spoke can use: git cannot carry the key, and Argo
cannot pass --set-file. The bundle is copied ONCE from the hub's
spoke-<cluster>-tls Secret into the spoke's vault (README "Onboard a spoke");
that is why the hub issues these client certs with the CA's lifetime.

TWO THINGS THAT WILL BITE (same as every SPC on the platform):
  1. The Azure provider fails the ENTIRE mount if any object below is missing:
     the Alloy pod sits in ContainerCreating. Seed all three first.
  2. Do NOT add rotationPollInterval here: it is not a field of the CRD.

Authentication (mtls.keyVault.authMode):
  workloadIdentity   DEFAULT: the agent's ServiceAccount, federated (on an on-prem
                     spoke that needs a published OIDC issuer -- chart oidc-issuer).
  vmManagedIdentity  the kubelet identity (AKS).
  servicePrincipal   on-prem without an issuer: the per-namespace
                     secrets-store-creds Secret, named by nodePublishSecretRef.
templates/assertions.yaml enforces the volume and identity side.
*/}}
{{- if eq .Values.mtls.source "keyVault" }}
{{- $kv := .Values.mtls.keyVault }}
{{- $prefix := required "mtls.keyVault.objectPrefix is required" $kv.objectPrefix }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cluster-monitoring-agent-hub-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-monitoring-agent.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    {{- if eq $kv.authMode "workloadIdentity" }}
    useVMManagedIdentity: "false"
    clientID: {{ required "alloy.serviceAccount.annotations[azure.workload.identity/client-id] is required for authMode workloadIdentity" (dig "annotations" "azure.workload.identity/client-id" "" .Values.alloy.serviceAccount) | quote }}
    {{- else if eq $kv.authMode "vmManagedIdentity" }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "mtls.keyVault.kubeletClientId is required for authMode vmManagedIdentity (the kubelet identity's CLIENT id, not its object id)" $kv.kubeletClientId | quote }}
    {{- else if eq $kv.authMode "servicePrincipal" }}
    useVMManagedIdentity: "false"
    {{- else }}
    {{- fail (printf "mtls.keyVault.authMode must be workloadIdentity, vmManagedIdentity or servicePrincipal, got %q" $kv.authMode) }}
    {{- end }}
    keyvaultName: {{ required "mtls.keyVault.keyvaultName is required" $kv.keyvaultName | quote }}
    tenantId: {{ required "mtls.keyVault.tenantId is required" $kv.tenantId | quote }}
    # objectAlias = the file name inside the mount, which the Alloy config reads.
    objects: |
      array:
        - |
          objectName: {{ $prefix }}--client-crt
          objectType: secret
          objectAlias: client.crt
        - |
          objectName: {{ $prefix }}--client-key
          objectType: secret
          objectAlias: client.key
        - |
          objectName: {{ $prefix }}--ca-crt
          objectType: secret
          objectAlias: ca.crt
{{- end }}
