{{- /*
ServiceAccount for the backup CronJob.

Deliberately NOT gated on backup.enabled. The Azure federated credential in
the cluster stack in infra/ binds to this SA by name, and it is useful to have the
cluster side in place — and verifiable — before the backup itself is switched on. Creating
it costs nothing while backup.enabled is false: no pod references it.

Azure workload identity needs two halves and neither works alone:
  - this SA carries  azure.workload.identity/client-id: <user-assigned MI client id>
  - the backup POD carries the label  azure.workload.identity/use: "true"
    (set in cronjob.yaml when backup.azure.authMode == workloadIdentity)
The mutating webhook only projects a token when BOTH are present. With just the annotation
the pod starts fine and fails at `az login` with an error that names neither.
*/ -}}
{{- if .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongo.backupServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with .Values.backup.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- /*
ServiceAccount mongod runs as. Carries the Key Vault workload identity when
azureKeyVault.authMode is workloadIdentity (federated subject
system:serviceaccount:<ns>:<this name>).
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
  {{- if and .Values.azureKeyVault.enabled (eq .Values.azureKeyVault.authMode "workloadIdentity") }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureKeyVault.workloadIdentityClientId is required for authMode workloadIdentity" .Values.azureKeyVault.workloadIdentityClientId | quote }}
  {{- end }}
{{- end }}
