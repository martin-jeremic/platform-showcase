apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongo.fullname" . }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mongo.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: mongodb
      protocol: TCP
---
# Headless Service — required by the StatefulSet (spec.serviceName) to give the pod a
# stable DNS name (mongo-0.mongo-headless.<ns>.svc.cluster.local).
# Standalone today, but a replica set addresses its members by exactly these names, so
# this is also the piece that makes converting later possible without renaming anything.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongo.fullname" . }}-headless
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mongo.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: mongodb
