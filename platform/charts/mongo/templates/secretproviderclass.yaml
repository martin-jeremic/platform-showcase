{{- if .Values.azureKeyVault.enabled }}
{{- $secretPrefix := .Values.azureKeyVault.secretPrefix }}
{{- if not .Values.azureKeyVault.secrets }}
{{- fail "azureKeyVault.enabled=true but azureKeyVault.secrets is empty — nothing would be synced and the pod would never get a password" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.azureKeyVault.secretProviderClassName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongo.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - data:
        {{- range .Values.azureKeyVault.secrets }}
        - objectName: {{ $secretPrefix }}--{{ .kvName }}
          key: {{ .key }}
        {{- end }}
      secretName: {{ .Values.azureKeyVault.syncedSecretName }}
      type: Opaque
  parameters:
    usePodIdentity: "false"
    {{- if eq .Values.azureKeyVault.authMode "vmManagedIdentity" }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "azureKeyVault.kubeletClientId is required for vmManagedIdentity mode" .Values.azureKeyVault.kubeletClientId }}
    {{- else if eq .Values.azureKeyVault.authMode "workloadIdentity" }}
    # Stated explicitly: no node-identity fallback, so a wrong federated credential
    # fails the mount loudly instead of quietly succeeding as the kubelet identity.
    useVMManagedIdentity: "false"
    clientID: {{ required "azureKeyVault.workloadIdentityClientId is required for workloadIdentity mode" .Values.azureKeyVault.workloadIdentityClientId }}
    {{- else if eq .Values.azureKeyVault.authMode "servicePrincipal" }}
    useVMManagedIdentity: "false"
    {{- else }}
    {{- fail "azureKeyVault.authMode must be one of: vmManagedIdentity, workloadIdentity, servicePrincipal" }}
    {{- end }}
    keyvaultName: {{ required "azureKeyVault.keyvaultName is required" .Values.azureKeyVault.keyvaultName }}
    tenantId: {{ required "azureKeyVault.tenantId is required" .Values.azureKeyVault.tenantId }}
    {{- /*
    Do NOT add rotationPollInterval here. It is not a field of the SecretProviderClass
    CRD, and rendering it breaks ArgoCD with "field not declared in schema". Rotation is
    a DRIVER flag (--enable-secret-rotation / --rotation-poll-interval), configured
    cluster-wide by the secrets-store-csi platform component.
    */}}
    objects: |
      array:
        {{- range .Values.azureKeyVault.secrets }}
        - |
          objectName: {{ $secretPrefix }}--{{ .kvName }}
          objectType: secret
        {{- end }}
{{- end }}
