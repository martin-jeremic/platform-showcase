{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elasticsearch.fullname" . }}
  labels:
    {{- include "elasticsearch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "elasticsearch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow authorized pods in the same namespace (direct cluster-internal access)
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.allowedPodSelector | nindent 12 }}
      ports:
        - port: {{ .Values.service.httpPort }}
    # Allow Traefik gateway namespace (routed external access)
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.allowedNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.service.httpPort }}
    # Always allow internal transport between ES nodes
    - from:
        - podSelector:
            matchLabels:
              {{- include "elasticsearch.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.transportPort }}
{{- end }}
