{{- /*
Optional SecretProviderClasses templated on top of the driver + provider.
List-driven (see .Values.secretProviderClasses); each item that is `enabled`
renders one SecretProviderClass. Normally SPCs live in the consuming app's own
chart — this is here for centrally-owned / smoke-test cases.

NOTE: a SecretProviderClass is a CRD instance installed by the driver subchart.
On a first-time install into an empty cluster, prefer letting the driver come up
(CRDs Established) before applying SPCs, or apply them from a later Argo sync-wave.
*/ -}}
{{- range .Values.secretProviderClasses }}
{{- if .enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "platform-secrets-store-csi.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  provider: {{ .provider | default "azure" }}
  {{- with .secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parameters:
    {{- toYaml (required (printf "secretProviderClasses[%s]: .parameters is required" .name) .parameters) | nindent 4 }}
{{- end }}
{{- end }}
