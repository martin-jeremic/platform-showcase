# CI values: one centrally-owned smoke-test SPC, in the required workload-identity
# shape, so the optional template is rendered too.
secretProviderClasses:
  - name: smoke-test
    enabled: true
    namespace: cluster-test
    parameters:
      usePodIdentity: "false"
      useVMManagedIdentity: "false"
      clientID: "22222222-2222-2222-2222-222222222222"
      keyvaultName: kv-product-a-prod
      tenantId: "11111111-1111-1111-1111-111111111111"
      objects: |
        array:
          - |
            objectName: cluster-test--smoke
            objectType: secret
