{{- /*
Azure Key Vault -> files inside the Alertmanager pod, via the Secrets Store CSI
driver. Only when notifications.enabled.

The Alertmanager pod mounts THIS SecretProviderClass directly (CSI volume in
kubePromStack.alertmanager.alertmanagerSpec.volumes, cluster values), and the
config references the mounted files with webhook_url_file / client_secret_file:
  - no Kubernetes Secret is synced (no secretObjects), and none is hand-seeded;
  - rotation is a vault write: the driver rewrites the mounted file every
    rotationPollInterval and Alertmanager reads the file at use.

This replaced a hand-seeded Secret mounted through alertmanagerSpec.secrets. It
was never applied on the production cluster, so the first sync that mounted it
left alertmanager-0 in Init with `secret ... not found` -- and no alert reached
anyone. The premise behind it ("the operator-managed pod cannot mount a CSI
volume") was wrong: alertmanagerSpec.volumes takes a CSI volume like any pod spec.

TWO THINGS THAT WILL BITE (same as every SPC on the platform):
  1. The Azure provider fails the ENTIRE mount if any object below is missing
     from the vault: alertmanager-0 sits in ContainerCreating. Every object is
     written by the alerting stack in infra/; apply it first.
  2. Do NOT add rotationPollInterval here: it is not a field of the
     SecretProviderClass CRD (Argo: "field not declared in schema"). Rotation is a
     driver flag.

Authentication (notifications.keyVault.authMode):
  workloadIdentity   DEFAULT. The Alertmanager ServiceAccount, federated to a
                     user-assigned identity with Key Vault Secrets User on this
                     vault only. Stated explicitly: no node-identity fallback, so a
                     wrong federated credential fails the mount loudly instead of
                     quietly succeeding as the kubelet identity.
  vmManagedIdentity  the kubelet identity. No nodePublishSecretRef.
  servicePrincipal   on-prem: the per-namespace secrets-store-creds Secret, named
                     by the volume's nodePublishSecretRef.
observability.alertmanagerKvMountPath enforces the volume and identity side.
*/}}
{{- if .Values.notifications.enabled }}
{{- $kv := .Values.notifications.keyVault }}
{{- $prefix := required "notifications.keyVault.objectPrefix is required" $kv.objectPrefix }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "observability.alertmanagerKvName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager-credentials
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    {{- if eq $kv.authMode "workloadIdentity" }}
    useVMManagedIdentity: "false"
    clientID: {{ required "the Alertmanager ServiceAccount client-id annotation is required for authMode workloadIdentity" (dig "serviceAccount" "annotations" "azure.workload.identity/client-id" "" .Values.kubePromStack.alertmanager) | quote }}
    {{- else if eq $kv.authMode "vmManagedIdentity" }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "notifications.keyVault.kubeletClientId is required for authMode vmManagedIdentity (the kubelet identity's CLIENT id, not its object id)" $kv.kubeletClientId | quote }}
    {{- else if eq $kv.authMode "servicePrincipal" }}
    useVMManagedIdentity: "false"
    {{- else }}
    {{- fail (printf "notifications.keyVault.authMode must be workloadIdentity, vmManagedIdentity or servicePrincipal, got %q" (toString $kv.authMode)) }}
    {{- end }}
    keyvaultName: {{ required "notifications.keyVault.keyvaultName is required" $kv.keyvaultName | quote }}
    tenantId: {{ required "notifications.tenantId is required" .Values.notifications.tenantId | quote }}
    # objectAlias = the file name inside the mount, which the rendered config
    # references. One Teams webhook per destination: the default one, then one per
    # audience (names validated by alertmanager-config.yaml).
    objects: |
      array:
        - |
          objectName: {{ $prefix }}--{{ include "observability.teamsWebhookFile" "" }}
          objectType: secret
          objectAlias: {{ include "observability.teamsWebhookFile" "" }}
        {{- range $name, $_ := (.Values.notifications.audiences | default dict) }}
        - |
          objectName: {{ $prefix }}--{{ include "observability.teamsWebhookFile" $name }}
          objectType: secret
          objectAlias: {{ include "observability.teamsWebhookFile" $name }}
        {{- end }}
        - |
          objectName: {{ $prefix }}--graph-client-secret
          objectType: secret
          objectAlias: graph-client-secret
{{- end }}
