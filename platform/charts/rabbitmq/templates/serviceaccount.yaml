{{- /*
ServiceAccount for the broker, carrying the Azure Workload Identity annotation.

The chart this was forked from had NO ServiceAccount template at all — its own
values file said "the chart DOES NOT create the ServiceAccount or Workload Identity
binding; those are provisioned out-of-band". That is what left the demo cluster
falling back to the kubelet managed identity (finding M11).

Workload identity needs three things, and two of them are here:
  1. this annotation on the ServiceAccount           <- here
  2. the pod labelled azure.workload.identity/use    <- statefulset.yaml
  3. a federated identity credential in Azure, mapping
       issuer = the cluster OIDC issuer URL
       subject = system:serviceaccount:<namespace>:<this ServiceAccount>
     to the user-assigned MI whose clientID is set below   <- the inputs contract

Get 1 and 2 wrong and the CSI mount fails; get 3 wrong and it also fails — always
loudly, never by silently falling back to a broader identity, because the SPC pins
useVMManagedIdentity: "false".
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rabbitmq.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.azureKeyVault.enabled (eq .Values.azureKeyVault.authMode "workloadIdentity") }}
    azure.workload.identity/client-id: {{ required "azureKeyVault.workloadIdentityClientId is required for workloadIdentity mode" .Values.azureKeyVault.workloadIdentityClientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
