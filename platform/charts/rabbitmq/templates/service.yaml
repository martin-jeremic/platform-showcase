apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.service.amqpPort }}
      targetPort: amqp
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.amqp }}
      nodePort: {{ .Values.service.nodePorts.amqp }}
      {{- end }}
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.management }}
      nodePort: {{ .Values.service.nodePorts.management }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    # Only on the main Service, deliberately. The headless Service selects the
    # same pod, so publishing the port there too would give the ServiceMonitor a
    # second Endpoints object for one broker and double every series.
    - name: prometheus
      port: {{ .Values.metrics.port }}
      targetPort: prometheus
      protocol: TCP
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}-headless
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.service.amqpPort }}
      targetPort: amqp
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
