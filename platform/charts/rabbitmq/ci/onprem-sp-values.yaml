# CI values: an on-prem spoke (no OIDC issuer federation for this namespace), the
# servicePrincipal option -- the CSI volume names secrets-store-creds.
azureKeyVault:
  authMode: servicePrincipal
  credentialsSecretName: secrets-store-creds
  tenantId: "11111111-1111-1111-1111-111111111111"
  keyvaultName: kv-product-a-stage
persistence:
  storageClass: microk8s-hostpath
nodeSelector: {}
tolerations: []
