{{- /*
One Argo CD cluster registration per entry in .Values.clusters.

Argo CD discovers a cluster from any Secret in its namespace labelled
  argocd.argoproj.io/secret-type: cluster
with keys: name, server, and a `config` JSON blob holding the bearerToken and the
tlsClientConfig. This template renders an ExternalSecret; the External Secrets
Operator fetches the token from Azure Key Vault and assembles that Secret through
target.template.

DOUBLE TEMPLATING. target.template is ESO's own Go template, evaluated AFTER Helm.
`{{ "{{ .token }}" }}` makes Helm emit the LITERAL text {{ .token }}, which ESO then
substitutes with the value fetched below. Writing {{ .token }} directly would make
Helm evaluate it -- to nothing -- and every cluster Secret would carry an empty
bearer token.

LOOPBACK IS REFUSED. `argocd cluster add` against a local kubeconfig records the
API server as https://127.0.0.1:<port> (MicroK8s, kind, port-forwards). That URL is
the HUB's own loopback, so the registration looks valid and every sync fails with
"connection refused" against a cluster that is up.
*/ -}}
{{- $ns := .Values.argocdNamespace -}}
{{- range .Values.clusters }}
{{- if not .name }}{{ fail "every clusters[] entry needs a name" }}{{- end }}
{{- if not .server }}{{ fail (printf "clusters[%s] needs a server URL" .name) }}{{- end }}
{{- if or (hasPrefix "https://127." .server) (hasPrefix "https://localhost" .server) (hasPrefix "https://[::1]" .server) }}
{{- fail (printf "clusters[%s].server is loopback (%s) -- the hub cannot reach it; use the remote API address the hub can route to" .name .server) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-{{ .name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: cluster-{{ .name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          {{- range $k, $v := .labels }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
      data:
        name: {{ .name }}
        server: {{ .server }}
        {{- with .project }}
        project: {{ . }}
        {{- end }}
        {{- if .insecure }}
        config: '{"bearerToken":"{{ "{{ .token }}" }}","tlsClientConfig":{"insecure":true}}'
        {{- else }}
        config: '{"bearerToken":"{{ "{{ .token }}" }}","tlsClientConfig":{"insecure":false,"caData":"{{ required (printf "clusters[%s].caData is required (or set insecure: true)" .name) .caData }}"}}'
        {{- end }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ required (printf "clusters[%s].akvKey is required: the Key Vault secret holding the bearer token" .name) .akvKey }}
{{- end }}
