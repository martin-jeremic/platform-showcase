{{- if .Values.gateway.name -}}
{{- $params := index .Values "argo-cd" "configs" "params" -}}
{{- if ne (toString .Values.route.pathPrefix) (toString (index $params "server.rootpath")) -}}
{{- fail (printf "route.pathPrefix (%q) differs from argo-cd.configs.params.server.rootpath (%q): the UI would load and every asset and API call would 404" .Values.route.pathPrefix (index $params "server.rootpath")) -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-argocd.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ required "gateway.sectionName is required: without it the route also binds to the plaintext listener" .Values.gateway.sectionName }}
  hostnames:
    - {{ required "route.hostname is required -- the public host Argo CD is served on" .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix | quote }}
      {{- with .Values.route.middlewares }}
      filters:
        {{- range . }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ . }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ include "platform-argocd.serverServiceName" . }}
          namespace: {{ .Release.Namespace }}
          port: 80
{{- end }}
