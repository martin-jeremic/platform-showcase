{{- if .Values.gatewayClass.create -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "platform-traefik.labels" . | nindent 4 }}
  annotations:
    # Cluster-scoped + shared: keep the object if this release is removed.
    helm.sh/resource-policy: keep
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
{{- end }}
