{{- if .Values.certificate.enabled -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ include "platform-traefik.gatewayNamespace" . }}
  labels:
    {{- include "platform-traefik.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  dnsNames:
    {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
    group: {{ default "cert-manager.io" .Values.certificate.issuerRef.group }}
  {{- with .Values.certificate.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
