# CI values: the shape of platform/values/<cluster>/traefik.yaml in the gitops repo.
gateway:
  listeners:
    websecure:
      hostname: app.product-a.example.net
certificate:
  dnsNames:
    - app.product-a.example.net
redirect:
  hostnames:
    - app.product-a.example.net
traefik:
  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-product-a-prod-network
      service.beta.kubernetes.io/azure-pip-name: pip-product-a-prod-edge
