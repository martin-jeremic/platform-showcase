{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "headlamp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ required "httpRoute.gateway.sectionName is required" .Values.httpRoute.gateway.sectionName }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required" .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    # /headlamp -> /headlamp/ : the SPA resolves its assets relative to the trailing
    # slash, so the bare prefix renders a blank page.
    - matches:
        - path:
            type: Exact
            value: {{ .Values.baseUrl }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.baseUrl }}/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.baseUrl }}/
      backendRefs:
        - name: {{ include "headlamp.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
