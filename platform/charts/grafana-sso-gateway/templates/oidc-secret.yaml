{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) }}
{{- $issuer := include "grafana-sso-gateway.issuer" . -}}
{{- $g := .Values.oidc.grafana -}}
{{- /*
This Secret carries the NON-SENSITIVE OIDC configuration only.

The forked chart also rendered GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from a values
key, with a `fail` guard demanding it be passed at install time. That is the same
footgun that put a live Cloudflare token into git in the cert-manager chart: a
values key that accepts a credential eventually holds one. It is removed here, and
there is no values key that could hold it.

The client secret lives in a separate, hand-seeded Secret
(grafana-oidc) applied from the gitops
setup/ folder. Grafana loads BOTH: see the note in
values.yaml on envFromSecrets.

Why not Key Vault over CSI, like the rest: the Grafana pod mounts no
SecretProviderClass volume, and the CSI driver only syncs while a pod does.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana-sso-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed by Grafana via `grafana.envFromSecret: {{ .Values.oidc.secretName }}`
  # in the kube-prom-stack release. Each key becomes a Grafana env var.
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: {{ $g.displayName | quote }}
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  GF_AUTH_GENERIC_OAUTH_SCOPES: {{ $g.scopes | quote }}
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ printf "%s/protocol/openid-connect/auth" $issuer | quote }}
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: {{ printf "%s/protocol/openid-connect/token" $issuer | quote }}
  GF_AUTH_GENERIC_OAUTH_API_URL: {{ printf "%s/protocol/openid-connect/userinfo" $issuer | quote }}
  GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: {{ $g.loginAttributePath | quote }}
  GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: {{ $g.emailAttributePath | quote }}
  GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: {{ $g.nameAttributePath | quote }}
  GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: {{ $g.groupsAttributePath | quote }}
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: {{ $g.roleAttributePath | quote }}
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: {{ $g.roleAttributeStrict | quote }}
  {{- with $g.orgMapping }}
  GF_AUTH_GENERIC_OAUTH_ORG_MAPPING: {{ . | quote }}
  {{- end }}
  GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: {{ $g.allowAssignGrafanaAdmin | quote }}
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: {{ $g.allowSignUp | quote }}
  GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: {{ $g.autoLogin | quote }}
  GF_AUTH_GENERIC_OAUTH_USE_PKCE: {{ $g.usePkce | quote }}
  GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: {{ $g.useRefreshToken | quote }}
{{- end }}
