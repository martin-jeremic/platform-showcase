apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-test.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-test.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-test.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-test.labels" . | nindent 8 }}
      annotations:
        # Roll pods when the page/nginx config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Render the HTML from the ConfigMap template, injecting live pod facts
      # from the Downward API + a render timestamp, into a shared emptyDir.
      initContainers:
        - name: render
          image: {{ include "cluster-test.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export RENDERED_AT="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              envsubst '$CLUSTER_NAME $POD_NAMESPACE $POD_NAME $NODE_NAME $POD_IP $SERVED_AT $APP_VERSION $RENDERED_AT' \
                < /tmpl/index.html.tmpl > /web/index.html
              echo "rendered /web/index.html for pod ${POD_NAME} on node ${NODE_NAME}"
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: SERVED_AT
              value: {{ .Values.welcomePath | quote }}
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: tmpl
              mountPath: /tmpl
              readOnly: true
            - name: web
              mountPath: /web
      containers:
        - name: nginx
          image: {{ include "cluster-test.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tmpl
          configMap:
            name: {{ include "cluster-test.fullname" . }}
            items:
              - key: index.html.tmpl
                path: index.html.tmpl
        - name: nginx-conf
          configMap:
            name: {{ include "cluster-test.fullname" . }}
            items:
              - key: default.conf
                path: default.conf
        - name: web
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
