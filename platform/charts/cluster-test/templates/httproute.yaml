{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cluster-test.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-test.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- with .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.welcomePath | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "cluster-test.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.httpRoute.extraRule }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
