apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cluster-test.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-test.labels" . | nindent 4 }}
data:
  # -- nginx server block. Serves the rendered page at welcomePath, a cheap
  #    /healthz for probes, and bounces everything else to the welcome page.
  default.conf: |
    server {
        listen       {{ .Values.service.targetPort }};
        server_name  _;
        root         /usr/share/nginx/html;

        # Probe target: always 200, no dependency on the page.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The welcome page (gateway routes {{ .Values.welcomePath }} here).
        location {{ .Values.welcomePath }} {
            default_type text/html;
            try_files /index.html =404;
        }

        # Anything else -> the welcome page.
        location / {
            return 302 {{ .Values.welcomePath }};
        }
    }

  # -- HTML template. `${VAR}` placeholders are filled at pod start by the
  #    envsubst init container from the Downward API — do NOT hard-code values.
  index.html.tmpl: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Cluster test — ${CLUSTER_NAME}</title>
      <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; display: grid; place-items: center;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); color: #e2e8f0;
        }
        .card {
          width: min(680px, 92vw); background: rgba(15,23,42,.72);
          border: 1px solid rgba(148,163,184,.25); border-radius: 16px;
          padding: 2rem 2.25rem; box-shadow: 0 20px 60px rgba(0,0,0,.45);
          backdrop-filter: blur(6px);
        }
        .badge {
          display: inline-flex; align-items: center; gap: .5rem;
          background: rgba(34,197,94,.15); color: #4ade80;
          border: 1px solid rgba(34,197,94,.4); border-radius: 999px;
          padding: .35rem .9rem; font-weight: 600; font-size: .9rem;
        }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80;
               box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: pulse 1.8s infinite; }
        @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(74,222,128,0); }
                           100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
        h1 { margin: 1rem 0 .25rem; font-size: 1.6rem; }
        p.sub { margin: 0 0 1.5rem; color: #94a3b8; }
        dl { display: grid; grid-template-columns: 9rem 1fr; gap: .55rem 1rem; margin: 0; }
        dt { color: #94a3b8; font-size: .9rem; }
        dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: .95rem; word-break: break-all; }
        footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(148,163,184,.2);
                 color: #64748b; font-size: .8rem; display: flex; justify-content: space-between; gap: 1rem; }
      </style>
    </head>
    <body>
      <main class="card">
        <span class="badge"><span class="dot"></span> Cluster is serving traffic</span>
        <h1>Hello from <strong>${CLUSTER_NAME}</strong></h1>
        <p class="sub">This request reached a real pod through the gateway. Refresh to hit another one.</p>
        <dl>
          <dt>Cluster</dt><dd>${CLUSTER_NAME}</dd>
          <dt>Namespace</dt><dd>${POD_NAMESPACE}</dd>
          <dt>Pod</dt><dd>${POD_NAME}</dd>
          <dt>Node</dt><dd>${NODE_NAME}</dd>
          <dt>Pod IP</dt><dd>${POD_IP}</dd>
          <dt>Served at</dt><dd>${SERVED_AT}</dd>
        </dl>
        <footer>
          <span>cluster-test v${APP_VERSION}</span>
          <span>pod started ${RENDERED_AT}</span>
        </footer>
      </main>
    </body>
    </html>
