{{- /* Cluster-scoped issuers, list-driven. Each entry: { name, enabled, spec }. */ -}}
{{- range .Values.clusterIssuers }}
{{- if .enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
  labels:
    {{- include "platform-cert-manager.labels" $ | nindent 4 }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
{{- end }}
